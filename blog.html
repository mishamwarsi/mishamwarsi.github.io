<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Posts — Misham Warsi</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <nav class="nav-container">
    <a href="index.html" class="logo">Misham Warsi</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="blog.html" class="active">All Posts</a>
      <a href="about.html">About</a>
    </div>
    <div class="nav-tags">
      <a href="blog.html?cat=sap" class="tag tag-sap">SAP</a>
      <a href="blog.html?cat=travel" class="tag tag-travel">Travel</a>
      <a href="blog.html?cat=tech" class="tag tag-tech">Tech</a>
    </div>
  </nav>
</header>

<main class="blog-main">
  <div class="blog-header">
    <h1 id="page-title">All Posts</h1>
    <div class="filter-bar">
      <button class="filter-btn active" data-cat="all">All</button>
      <button class="filter-btn" data-cat="sap">SAP</button>
      <button class="filter-btn" data-cat="travel">Travel</button>
      <button class="filter-btn" data-cat="tech">Tech</button>
    </div>
  </div>

  <div class="posts-list" id="posts-list">
    <div class="loading-state">Loading posts...</div>
  </div>
</main>

<footer class="site-footer">
  <p>© 2025 Misham Warsi · Built with passion, hosted on GitHub Pages</p>
</footer>

<script src="js/app.js"></script>
<script>
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const cat = btn.dataset.cat;
      renderPostsList(cat === 'all' ? null : cat);
    });
  });

  const urlCat = new URLSearchParams(window.location.search).get('cat');
  if (urlCat) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    const matchBtn = document.querySelector(`.filter-btn[data-cat="${urlCat}"]`);
    if (matchBtn) matchBtn.classList.add('active');
  }
</script>
</body>
</html>
